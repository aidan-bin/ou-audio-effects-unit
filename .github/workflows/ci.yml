name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy cmake build-essential

      - name: Build
        run: ./scripts/build.sh

      - name: Test
        run: ./scripts/test.sh

      - name: Lint
        run: ./scripts/lint.sh

      - name: Format check
        run: |
          find dsp -type f \( -name '*.c' -o -name '*.h' \) -print0 | \
            xargs -0 clang-format --dry-run --Werror
