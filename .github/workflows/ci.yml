name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential clang-format clang-tidy python3 python3-pip gcc-arm-none-eabi ninja-build

      - name: Doctor
        run: ./scripts/run.sh doctor

      - name: Configure CubeMX firmware (for compile database)
        run: cmake --preset Debug
        working-directory: firmware/stm32f303/cubemx

      - name: Configure Nucleo firmware (for compile database)
        run: cmake --preset Debug
        working-directory: firmware/stm32f303/nucleo-ou-audio-effects

      - name: Check
        run: ./scripts/run.sh check-full
