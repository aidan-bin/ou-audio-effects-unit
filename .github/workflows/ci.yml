name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tooling
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main"
          sudo apt-get update
          sudo apt-get install -y cmake build-essential clang-format-19 clang-tidy python3 python3-pip gcc-arm-none-eabi ninja-build
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-19 100
          pip install ruff

      - name: Configure Nucleo firmware (for compile database)
        run: cmake --preset Debug
        working-directory: firmware/stm32f303/nucleo-ou-audio-effects

      - name: Debug ARM paths (temp)
        run: |
          gcc="$(grep -m1 -o '/[^ ]*arm-none-eabi-gcc' firmware/stm32f303/nucleo-ou-audio-effects/build/Debug/compile_commands.json || command -v arm-none-eabi-gcc)"
          echo "compiler: $gcc"
          echo "include:"; $gcc -print-file-name=include
          echo "include-fixed:"; $gcc -print-file-name=include-fixed
          echo "sysroot:"; $gcc -print-sysroot
          echo "libgcc:"; $gcc -print-libgcc-file-name
          ls "$($gcc -print-file-name=include)/stdio.h" 2>&1 || true
          ls "$(dirname "$($gcc -print-libgcc-file-name)")/include/stdio.h" 2>&1 || true
          ls "$(dirname "$(dirname "$gcc")")/arm-none-eabi/include/stdio.h" 2>&1 || true
          find /usr -name "stdio.h" -path "*/arm-none*" 2>/dev/null | head -5

      - name: Check
        run: ./scripts/run.sh check-full
