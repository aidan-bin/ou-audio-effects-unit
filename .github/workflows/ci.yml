name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential clang-format clang-tidy python3 python3-pip

      - name: Doctor
        run: ./scripts/doctor.sh

      - name: Check
        run: ./scripts/check-full.sh
