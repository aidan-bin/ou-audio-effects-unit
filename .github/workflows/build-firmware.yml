name: build-firmware

on:
  workflow_dispatch:
    inputs:
      preset:
        description: CMake build preset
        required: false
        default: Release

permissions:
  contents: read

jobs:
  build-firmware-nucleo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi
      - name: Configure
        run: cmake --preset Release
        working-directory: firmware/stm32f303/nucleo-ou-audio-effects
      - name: Build
        run: cmake --build --preset Release
        working-directory: firmware/stm32f303/nucleo-ou-audio-effects
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: nucleo-ou-audio-effects
          path: firmware/stm32f303/nucleo-ou-audio-effects/build/Release/nucleo-ou-audio-effects.elf
